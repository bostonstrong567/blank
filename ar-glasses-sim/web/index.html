<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AR Glasses Simulator</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #88aaff;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  height: 100vh;
  height: 100dvh;
}
#container {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
}
video { display: none; }
canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
#loading {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 100;
  font-size: 16px;
}
#loading .spinner {
  width: 40px; height: 40px;
  border: 3px solid #333;
  border-top: 3px solid #88aaff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
#controls {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.7);
  padding: 10px 12px;
  z-index: 50;
  display: none;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
#controls .row {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
#controls .row:last-child { margin-bottom: 0; }
#controls button {
  background: rgba(136,170,255,0.15);
  border: 1px solid rgba(136,170,255,0.4);
  color: #88aaff;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 4px;
  flex: 1;
  min-width: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#controls button.active {
  background: rgba(136,170,255,0.35);
  border-color: #88aaff;
}
#controls .label {
  font-size: 10px;
  color: #667;
  margin-bottom: 2px;
}
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading AR Model...</div>
    <div id="load-status" style="font-size:12px;color:#667;margin-top:8px;">Initializing TensorFlow.js</div>
  </div>
  <div id="controls">
    <div class="label">RESOLUTION</div>
    <div class="row">
      <button id="btn-res-high">720p</button>
      <button id="btn-res-med" class="active">480p</button>
      <button id="btn-res-low">240p</button>
    </div>
    <div class="label">SIMULATE HARDWARE</div>
    <div class="row">
      <button id="btn-fps-cap">FPS Cap: OFF</button>
      <button id="btn-latency">+Latency: OFF</button>
      <button id="btn-noise">Noise: OFF</button>
    </div>
    <div class="label">DISPLAY</div>
    <div class="row">
      <button id="btn-scanlines">Scanlines</button>
      <button id="btn-vignette" class="active">Vignette</button>
      <button id="btn-conf">Conf: 0.5</button>
      <button id="btn-screenshot">Screenshot</button>
    </div>
  </div>
</div>

<script>
// ─── Config ──────────────────────────────────────────────
const CYAN = '#88aaff';
const CYAN_RGB = [136, 170, 255];
const RESOLUTIONS = {
  high: { w: 1280, h: 720, label: '720p' },
  med:  { w: 640,  h: 480, label: '480p' },
  low:  { w: 320,  h: 240, label: '240p' },
};
const CONF_STEPS = [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9];
const SESSION_KEY = 'ar-glasses-sim-session';

// ─── Session persistence ─────────────────────────────────
const DEFAULT_STATE = {
  resolution: 'med',
  confIdx: 2,
  showScanlines: false,
  showVignette: true,
  fpsCap: false,
  addLatency: false,
  addNoise: false,
  running: true,
};

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return { ...DEFAULT_STATE };
    const parsed = JSON.parse(raw);
    // Validate each field; fall back to default for any corrupt/missing value
    const valid = { ...DEFAULT_STATE };
    if (parsed.resolution in RESOLUTIONS) valid.resolution = parsed.resolution;
    if (Number.isInteger(parsed.confIdx) && parsed.confIdx >= 0 && parsed.confIdx < CONF_STEPS.length)
      valid.confIdx = parsed.confIdx;
    if (typeof parsed.showScanlines === 'boolean') valid.showScanlines = parsed.showScanlines;
    if (typeof parsed.showVignette === 'boolean') valid.showVignette = parsed.showVignette;
    if (typeof parsed.fpsCap === 'boolean') valid.fpsCap = parsed.fpsCap;
    if (typeof parsed.addLatency === 'boolean') valid.addLatency = parsed.addLatency;
    if (typeof parsed.addNoise === 'boolean') valid.addNoise = parsed.addNoise;
    return valid;
  } catch (_) {
    // Corrupted data — clear it and use defaults
    try { localStorage.removeItem(SESSION_KEY); } catch (_2) {}
    return { ...DEFAULT_STATE };
  }
}

function saveSession() {
  try {
    const { resolution, confIdx, showScanlines, showVignette, fpsCap, addLatency, addNoise } = state;
    localStorage.setItem(SESSION_KEY, JSON.stringify(
      { resolution, confIdx, showScanlines, showVignette, fpsCap, addLatency, addNoise }
    ));
  } catch (_) {
    // Storage unavailable (private mode quota exceeded, etc.) — ignore
  }
}

// ─── State ───────────────────────────────────────────────
let state = loadSession();

// ─── Metrics ─────────────────────────────────────────────
let metrics = {
  fps: 0,
  inferenceMs: 0,
  renderMs: 0,
  totalMs: 0,
  personCount: 0,
  frameTimes: [],
};

// ─── Elements ────────────────────────────────────────────
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const loadingEl = document.getElementById('loading');
const loadStatus = document.getElementById('load-status');
const controlsEl = document.getElementById('controls');

let model = null;
let nextPersonId = 1;
let trackedPersons = []; // simple position-based tracking
let vignetteCache = null;
let vignetteCacheKey = '';

// ─── Init ────────────────────────────────────────────────
async function init() {
  try {
    loadStatus.textContent = 'Requesting camera access...';
    const res = RESOLUTIONS[state.resolution];

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: res.w },
        height: { ideal: res.h },
      },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();

    loadStatus.textContent = 'Loading COCO-SSD model...';
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });

    loadingEl.style.display = 'none';
    controlsEl.style.display = 'block';

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    requestAnimationFrame(loop);
  } catch (err) {
    loadStatus.textContent = 'Error: ' + err.message;
    loadStatus.style.color = '#ff5555';
  }
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  vignetteCache = null; // invalidate
}

// ─── Main Loop ───────────────────────────────────────────
let lastFrameTime = 0;
const FPS_CAP_INTERVAL = 1000 / 15; // 15fps cap when simulating

async function loop(timestamp) {
  if (!state.running) { requestAnimationFrame(loop); return; }

  // FPS cap simulation
  if (state.fpsCap && (timestamp - lastFrameTime) < FPS_CAP_INTERVAL) {
    requestAnimationFrame(loop);
    return;
  }

  const tStart = performance.now();

  // Simulate extra latency (fake processing delay)
  if (state.addLatency) {
    await sleep(randomInt(8, 25));
  }

  // Get frame dimensions
  const res = RESOLUTIONS[state.resolution];
  const vw = video.videoWidth || res.w;
  const vh = video.videoHeight || res.h;

  // Draw video to canvas at target resolution then scale up
  const cw = canvas.width;
  const ch = canvas.height;

  // Process at lower res for simulation
  const processW = res.w;
  const processH = res.h;

  // Draw video frame
  ctx.imageSmoothingEnabled = state.resolution !== 'low';
  ctx.drawImage(video, 0, 0, cw, ch);

  // Add noise if simulating
  if (state.addNoise) {
    applyNoise(ctx, cw, ch);
  }

  // Pixelate effect for low res simulation
  if (state.resolution === 'low') {
    applyPixelate(ctx, cw, ch, 4);
  }

  // Run detection
  const tInference = performance.now();
  let predictions = [];
  try {
    predictions = await model.detect(video, 20, 0.2);
  } catch(e) {}
  metrics.inferenceMs = performance.now() - tInference;

  // Filter by confidence and class
  const conf = CONF_STEPS[state.confIdx];
  const detections = predictions
    .filter(p => p.class === 'person' && p.score >= conf);

  metrics.personCount = detections.length;

  // Simple tracking
  trackedPersons = trackPersons(detections);

  // Render HUD
  const tRender = performance.now();

  // Scale detection coords from video space to canvas space
  const scaleX = cw / vw;
  const scaleY = ch / vh;

  for (const tp of trackedPersons) {
    const [bx, by, bw, bh] = tp.bbox;
    const x1 = Math.round(bx * scaleX);
    const y1 = Math.round(by * scaleY);
    const x2 = Math.round((bx + bw) * scaleX);
    const y2 = Math.round((by + bh) * scaleY);
    drawBracketBox(ctx, x1, y1, x2, y2, tp.score, tp.id);
  }

  // Vignette
  if (state.showVignette) {
    applyVignette(ctx, cw, ch);
  }

  // Scanlines
  if (state.showScanlines) {
    applyScanlines(ctx, cw, ch);
  }

  metrics.renderMs = performance.now() - tRender;
  metrics.totalMs = performance.now() - tStart;

  // FPS calc
  const now = performance.now();
  metrics.frameTimes.push(now);
  while (metrics.frameTimes.length > 0 && metrics.frameTimes[0] < now - 1000) {
    metrics.frameTimes.shift();
  }
  metrics.fps = metrics.frameTimes.length;

  lastFrameTime = timestamp;

  // Draw dashboard
  drawDashboard(ctx, cw);

  requestAnimationFrame(loop);
}

// ─── Bracket Box ─────────────────────────────────────────
function drawBracketBox(ctx, x1, y1, x2, y2, score, id) {
  const w = x2 - x1;
  const h = y2 - y1;
  const bx = Math.max(Math.round(w * 0.2), 10);
  const by = Math.max(Math.round(h * 0.2), 10);

  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 2;
  ctx.beginPath();
  // Top-left
  ctx.moveTo(x1 + bx, y1); ctx.lineTo(x1, y1); ctx.lineTo(x1, y1 + by);
  // Top-right
  ctx.moveTo(x2 - bx, y1); ctx.lineTo(x2, y1); ctx.lineTo(x2, y1 + by);
  // Bottom-left
  ctx.moveTo(x1 + bx, y2); ctx.lineTo(x1, y2); ctx.lineTo(x1, y2 - by);
  // Bottom-right
  ctx.moveTo(x2 - bx, y2); ctx.lineTo(x2, y2); ctx.lineTo(x2, y2 - by);
  ctx.stroke();

  // Label
  const label = `person #${id} ${Math.round(score * 100)}%`;
  const fontSize = Math.max(12, Math.min(16, w * 0.06));
  ctx.font = `${fontSize}px 'Courier New', monospace`;
  const tm = ctx.measureText(label);
  const lw = tm.width + 8;
  const lh = fontSize + 8;

  ctx.fillStyle = 'rgba(20,20,30,0.65)';
  ctx.fillRect(x1, y1 - lh - 2, lw, lh);
  ctx.fillStyle = CYAN;
  ctx.fillText(label, x1 + 4, y1 - 6);
}

// ─── Dashboard ───────────────────────────────────────────
function drawDashboard(ctx, cw) {
  const lines = [
    { text: `FPS: ${metrics.fps}`, size: 20, color: metrics.fps >= 20 ? '#66ff66' : metrics.fps >= 10 ? '#ffee55' : '#ff5555' },
    { text: `Inference: ${metrics.inferenceMs.toFixed(1)} ms`, size: 13, color: '#ccc' },
    { text: `Render:    ${metrics.renderMs.toFixed(1)} ms`, size: 13, color: '#ccc' },
    { text: `Total:     ${metrics.totalMs.toFixed(1)} ms`, size: 13, color: '#ccc' },
    { text: `Persons:   ${metrics.personCount}`, size: 13, color: CYAN },
    { text: `Res:       ${RESOLUTIONS[state.resolution].label}`, size: 13, color: '#6679aa' },
    { text: `Conf:      ${CONF_STEPS[state.confIdx].toFixed(1)}`, size: 13, color: '#6679aa' },
  ];

  if (state.fpsCap) lines.push({ text: '[FPS CAP 15]', size: 13, color: '#ff5555' });
  if (state.addLatency) lines.push({ text: '[+LATENCY]', size: 13, color: '#ff5555' });
  if (state.addNoise) lines.push({ text: '[NOISE]', size: 13, color: '#ff5555' });

  // Hailo projection
  const hailoFps = Math.round(1000 / (4 + metrics.renderMs));
  lines.push({ text: `Hailo-8L est: ${hailoFps} FPS`, size: 13, color: '#44ddaa' });

  let totalH = 16;
  for (const l of lines) totalH += l.size + 6;

  ctx.fillStyle = 'rgba(10,10,20,0.6)';
  const panelW = Math.min(240, cw - 20);
  ctx.fillRect(8, 8, panelW, totalH);

  let y = 28;
  for (const l of lines) {
    ctx.font = `${l.size}px 'Courier New', monospace`;
    ctx.fillStyle = l.color;
    ctx.fillText(l.text, 16, y);
    y += l.size + (l.size > 15 ? 10 : 5);
  }
}

// ─── Simple Tracker ──────────────────────────────────────
let prevTracked = [];

function trackPersons(detections) {
  const result = [];
  const used = new Set();

  for (const det of detections) {
    const cx = det.bbox[0] + det.bbox[2] / 2;
    const cy = det.bbox[1] + det.bbox[3] / 2;

    let bestDist = Infinity;
    let bestIdx = -1;

    for (let i = 0; i < prevTracked.length; i++) {
      if (used.has(i)) continue;
      const pcx = prevTracked[i].bbox[0] + prevTracked[i].bbox[2] / 2;
      const pcy = prevTracked[i].bbox[1] + prevTracked[i].bbox[3] / 2;
      const dist = Math.hypot(cx - pcx, cy - pcy);
      if (dist < bestDist) {
        bestDist = dist;
        bestIdx = i;
      }
    }

    const threshold = Math.max(det.bbox[2], det.bbox[3]) * 1.5;

    if (bestIdx >= 0 && bestDist < threshold) {
      used.add(bestIdx);
      result.push({ ...det, id: prevTracked[bestIdx].id });
    } else {
      result.push({ ...det, id: nextPersonId++ });
    }
  }

  prevTracked = result;
  return result;
}

// ─── Effects ─────────────────────────────────────────────
function applyVignette(ctx, w, h) {
  const key = `${w}x${h}`;
  if (!vignetteCache || vignetteCacheKey !== key) {
    const offscreen = document.createElement('canvas');
    offscreen.width = w;
    offscreen.height = h;
    const octx = offscreen.getContext('2d');
    const cx = w / 2, cy = h / 2;
    const r = Math.max(w, h) * 0.7;
    const grad = octx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.55)');
    octx.fillStyle = grad;
    octx.fillRect(0, 0, w, h);
    vignetteCache = offscreen;
    vignetteCacheKey = key;
  }
  ctx.drawImage(vignetteCache, 0, 0);
}

function applyScanlines(ctx, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let y = 0; y < h; y += 3) {
    ctx.fillRect(0, y, w, 1);
  }
}

function applyNoise(ctx, w, h) {
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;
  // Sample sparse pixels for performance
  const step = 4 * 4; // every 4th pixel
  for (let i = 0; i < data.length; i += step) {
    const noise = (Math.random() - 0.5) * 40;
    data[i] = Math.max(0, Math.min(255, data[i] + noise));
    data[i+1] = Math.max(0, Math.min(255, data[i+1] + noise));
    data[i+2] = Math.max(0, Math.min(255, data[i+2] + noise));
  }
  ctx.putImageData(imageData, 0, 0);
}

function applyPixelate(ctx, w, h, blockSize) {
  ctx.imageSmoothingEnabled = false;
  const tw = Math.ceil(w / blockSize);
  const th = Math.ceil(h / blockSize);
  ctx.drawImage(canvas, 0, 0, w, h, 0, 0, tw, th);
  ctx.drawImage(canvas, 0, 0, tw, th, 0, 0, w, h);
  ctx.imageSmoothingEnabled = true;
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// ─── Controls ────────────────────────────────────────────
function setupControls() {
  // Resolution
  document.getElementById('btn-res-high').addEventListener('click', () => setRes('high'));
  document.getElementById('btn-res-med').addEventListener('click', () => setRes('med'));
  document.getElementById('btn-res-low').addEventListener('click', () => setRes('low'));

  // Simulation
  document.getElementById('btn-fps-cap').addEventListener('click', () => {
    state.fpsCap = !state.fpsCap;
    document.getElementById('btn-fps-cap').textContent = `FPS Cap: ${state.fpsCap ? '15' : 'OFF'}`;
    document.getElementById('btn-fps-cap').classList.toggle('active', state.fpsCap);
    saveSession();
  });
  document.getElementById('btn-latency').addEventListener('click', () => {
    state.addLatency = !state.addLatency;
    document.getElementById('btn-latency').textContent = `+Latency: ${state.addLatency ? 'ON' : 'OFF'}`;
    document.getElementById('btn-latency').classList.toggle('active', state.addLatency);
    saveSession();
  });
  document.getElementById('btn-noise').addEventListener('click', () => {
    state.addNoise = !state.addNoise;
    document.getElementById('btn-noise').textContent = `Noise: ${state.addNoise ? 'ON' : 'OFF'}`;
    document.getElementById('btn-noise').classList.toggle('active', state.addNoise);
    saveSession();
  });

  // Display
  document.getElementById('btn-scanlines').addEventListener('click', () => {
    state.showScanlines = !state.showScanlines;
    document.getElementById('btn-scanlines').classList.toggle('active', state.showScanlines);
    saveSession();
  });
  document.getElementById('btn-vignette').addEventListener('click', () => {
    state.showVignette = !state.showVignette;
    document.getElementById('btn-vignette').classList.toggle('active', state.showVignette);
    saveSession();
  });
  document.getElementById('btn-conf').addEventListener('click', () => {
    state.confIdx = (state.confIdx + 1) % CONF_STEPS.length;
    document.getElementById('btn-conf').textContent = `Conf: ${CONF_STEPS[state.confIdx].toFixed(1)}`;
    saveSession();
  });
  document.getElementById('btn-screenshot').addEventListener('click', () => {
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ar-sim-${Date.now()}.png`;
      a.click();
    });
  });

  // Apply restored session state to UI
  document.getElementById('btn-res-high').classList.toggle('active', state.resolution === 'high');
  document.getElementById('btn-res-med').classList.toggle('active', state.resolution === 'med');
  document.getElementById('btn-res-low').classList.toggle('active', state.resolution === 'low');
  document.getElementById('btn-conf').textContent = `Conf: ${CONF_STEPS[state.confIdx].toFixed(1)}`;
  document.getElementById('btn-fps-cap').textContent = `FPS Cap: ${state.fpsCap ? '15' : 'OFF'}`;
  document.getElementById('btn-fps-cap').classList.toggle('active', state.fpsCap);
  document.getElementById('btn-latency').textContent = `+Latency: ${state.addLatency ? 'ON' : 'OFF'}`;
  document.getElementById('btn-latency').classList.toggle('active', state.addLatency);
  document.getElementById('btn-noise').textContent = `Noise: ${state.addNoise ? 'ON' : 'OFF'}`;
  document.getElementById('btn-noise').classList.toggle('active', state.addNoise);
  document.getElementById('btn-scanlines').classList.toggle('active', state.showScanlines);
  document.getElementById('btn-vignette').classList.toggle('active', state.showVignette);
}

function setRes(key) {
  state.resolution = key;
  saveSession();
  document.getElementById('btn-res-high').classList.toggle('active', key === 'high');
  document.getElementById('btn-res-med').classList.toggle('active', key === 'med');
  document.getElementById('btn-res-low').classList.toggle('active', key === 'low');

  // Restart camera at new resolution
  const res = RESOLUTIONS[key];
  const track = video.srcObject?.getVideoTracks()[0];
  if (track) {
    track.applyConstraints({
      width: { ideal: res.w },
      height: { ideal: res.h },
    });
  }
}

// ─── Start ───────────────────────────────────────────────
setupControls();
init();
</script>
</body>
</html>
